<!-- update_core_wizard -->
<div id="nx-updater">

<!-- Header Card -->
<div class="card shadow-sm mb-3 mt-4 nx-updater-head">
  <div class="card-body p-3 p-lg-4">
    <div class="nx-updater-head__grid">
      <div class="nx-updater-head__title">
        <span class="nx-updater-head__icon">
          <i class="bi bi-gear-fill"></i>
        </span>
        <div>
          <div class="nx-updater-head__eyebrow">Core Management</div>
          <h2>{update_title}</h2>
          <p>{update_subtitle}</p>
        </div>
      </div>

      <div class="nx-updater-head__channel">
        <div class="nx-updater-head__channel-top">
          <span><i class="bi bi-broadcast-pin me-1"></i>{update_channel_title}</span>
          {beta_badge}
        </div>
        {channel_form}
        <div class="nx-updater-head__hint">
          {update_channel_hint}
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 2-Spalten Layout -->
<div class="row g-3 align-items-start">

  <!-- Updates -->
  <div class="col-12 col-xl-12">

    <!-- Log Card -->
    <div class="card shadow-sm">
      <div class="card-header">
        <div class="card-title">
          <i class="bi bi-journal-code"></i> {update_log_title}
        </div>
      </div>
      <div class="card-body">
        <div class="nx-log-surface">
          <div class="nx-log-container p-3">
            {content}
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- LEFT -->
  <div class="col-12 col-xl-12">

    <!-- Progress + Steps Card -->
    <div class="card shadow-sm mt-4 mt-lg-3">
      <div class="card-header">
        <div class="card-title">
          <i class="bi bi-arrow-repeat"></i> {update_progress_title} &amp; {update_steps_title}
        </div>
      </div>
      <div id="nx-progress-wrapper" class="nx-progress">
        <div class="nx-progress-inner">
          {progress_bar}
        </div>
      </div>
    </div>

    {update_history}

    <!-- Mini Footer Hint -->
    <div class="text-muted text-center small mt-3 gap-2">
      <i class="bi bi-shield-check"></i>
      <span>{update_footer_hint}</span>
    </div>

  </div>
</div>
</div>
